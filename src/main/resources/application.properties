# =====================================================================
#  Spring Boot 4 – konfiguration
#  Läs README.md (avsnittet "Konfiguration") för förklaringar.
# =====================================================================
spring.application.name=library

# --- Virtuella trådar (Java 21+) ------------------------------------
# Tomcat kör varje request på en virtuell tråd i stället för en
# plattformstråd från en pool. Billigt att blocka (JDBC, HTTP-anrop).
spring.threads.virtual.enabled=true

# --- Databas (H2 in-memory) -----------------------------------------
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate 7 ------------------------------------------------
# Flyway äger schemat. Hibernate får bara kontrollera att entiteterna
# matchar tabellerna (validate) – aldrig skapa eller ändra dem.
spring.jpa.hibernate.ddl-auto=validate
# Stäng av "Open Session In View": all databasåtkomst ska ske i
# service-lagret inom en transaktion. Tvingar fram DTO:er och
# förhindrar dolda lazy-loading-frågor från controllern.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Sätt till true för att se SQL:en i loggen
spring.jpa.show-sql=false

# --- Flyway -----------------------------------------------------------
spring.flyway.locations=classpath:db/migration

# --- API-versionering (nytt i Spring Framework 7 / Boot 4) ------------
# Klienten väljer version med headern "API-Version: 2".
# Saknas headern används standardversionen 1.
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1

# --- Actuator ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
